version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Majors stay ungrouped - those are the ones worth reviewing individually.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Also acts as a supply-chain-attack buffer - most malicious releases get caught within days.
    cooldown:
      default-days: 4
      semver-major-days: 7
      semver-minor-days: 4
      semver-patch-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 4
      semver-major-days: 7
      semver-minor-days: 4
      semver-patch-days: 3
